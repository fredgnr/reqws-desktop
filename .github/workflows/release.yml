name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      marketplace-mode: ${{ vars.REQWS_MARKETPLACE_MODE }}

    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Log release job context
        run: python3 scripts/log-release-context.py

      - name: Validate Marketplace mode and release source
        env:
          REQWS_MARKETPLACE_MODE: ${{ vars.REQWS_MARKETPLACE_MODE }}
        run: python3 scripts/publish_jetbrains_marketplace.py mode

      - name: Validate tag and package versions
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$TAG" =~ $semver_re ]]; then
            echo '::error::Release tag must use vMAJOR.MINOR.PATCH without leading zeroes.'
            exit 1
          fi

          version="${TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"

          if [[ "$package_version" != "$version" \
            || "$lock_version" != "$version" \
            || "$lock_root_version" != "$version" ]]; then
            echo "::error::Version mismatch: tag=$version package=$package_version lock=$lock_version lock-root=$lock_root_version"
            exit 1
          fi

          default_ref="refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git show-ref --verify --quiet "$default_ref"; then
            echo "::error::Default branch ref is unavailable: $default_ref"
            exit 1
          fi

          tag_commit="$(git rev-parse "${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" "$default_ref"; then
            echo "::error::Release tag must point to a commit contained in $DEFAULT_BRANCH."
            exit 1
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf '[release][validate] status=success version=%s commit=%s\n' "$version" "$tag_commit"

  # Checks and both packages have independent workspaces. Only publish joins their gates.
  checks:
    name: Release project checks
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: 'true'

    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/Library/Caches/electron
          key: electron-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install locked dependencies
        run: npm ci

      - name: Log release job context
        run: python3 scripts/log-release-context.py

      - name: Set up Java for isolated plugin signature tests
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up OpenSSL for disposable identity tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          printf 'REQWS_OPENSSL=%s/bin/openssl\n' "$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Run release packaging regression tests
        run: python3 -m unittest discover -s tests/workflows -p 'test_*.py' -v

      - name: Run project checks
        run: npm run check

  package:
    name: Package macOS (arm64)
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    environment: macos-release
    env:
      ARCH: arm64
      CI: 'true'
      VERSION: ${{ needs.validate.outputs.version }}
      REQWS_BUILD_PROFILE: personal-release

    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/Library/Caches/electron
          key: electron-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install locked dependencies
        run: npm ci

      - name: Log release job context
        run: python3 scripts/log-release-context.py

      - name: Sign, package, and verify update archive
        id: signing
        env:
          MAC_SIGNING_P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
          MAC_SIGNING_CERT_SHA256: ${{ vars.MAC_SIGNING_CERT_SHA256 }}
        run: node scripts/with-macos-signing.mjs -- node scripts/build-macos-release.mts "$VERSION"

      - name: Clean up temporary signing state
        if: ${{ always() && (steps.signing.outcome == 'success' || steps.signing.outcome == 'failure' || steps.signing.outcome == 'cancelled') }}
        run: node scripts/with-macos-signing.mjs --cleanup

      - name: Upload intermediate release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-arm64
          path: |
            dist/release/ReqWS-${{ env.VERSION }}-macos-arm64.zip
            dist/release/ReqWS-${{ env.VERSION }}-macos-arm64.zip.sha256
            dist/release/latest-mac.yml
            dist/release/latest-mac.yml.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  goland-plugin:
    name: Package and verify GoLand plugin
    environment: jetbrains-plugin-signing
    needs: validate
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CI: 'true'
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log release job context
        run: python3 scripts/log-release-context.py

      - name: Set up GoLand build
        uses: ./.github/actions/setup-goland

      - name: Test, verify, and package the plugin
        working-directory: integrations/goland
        run: ./gradlew test verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin buildPlugin --no-daemon -PreleaseVersion="$VERSION"

      - name: Sign and verify the exact plugin archive
        id: plugin-signing
        env:
          JETBRAINS_PLUGIN_PRIVATE_KEY: ${{ secrets.JETBRAINS_PLUGIN_PRIVATE_KEY }}
          JETBRAINS_PLUGIN_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PLUGIN_PRIVATE_KEY_PASSWORD }}
        run: python3 scripts/plugin_signing.py sign --version "$VERSION"

      - name: Clean up temporary plugin signing material
        if: ${{ always() && steps.plugin-signing.outcome != 'skipped' }}
        run: python3 scripts/plugin_signing.py cleanup

      - name: Verify and stage plugin release ZIP
        run: python3 scripts/prepare-goland-release.py --input "$(cat integrations/goland/build/release/plugin-archive.txt)" --version "$VERSION"

      - name: Upload intermediate plugin release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-goland-plugin
          path: |
            dist/release/*.zip
            dist/release/*.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish GitHub release
    needs:
      - validate
      - checks
      - package
      - goland-plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
      REQWS_MARKETPLACE_MODE: ${{ needs.validate.outputs.marketplace-mode }}
      VERSION: ${{ needs.validate.outputs.version }}

    steps:
      - name: Check out release verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log release job context
        run: python3 scripts/log-release-context.py

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true

      - name: Verify release files and checksums
        run: python3 scripts/verify-release-assets.py --stage --directory dist/release --version "$VERSION"

      - name: Create, verify, and publish release
        run: |
          files=(
            "dist/release/ReqWS-${VERSION}-macos-arm64.zip"
            "dist/release/ReqWS-${VERSION}-goland-plugin.zip"
            'dist/release/latest-mac.yml'
            'dist/release/SHA256SUMS'
          )
          release_creation_attempted=false
          release_owner_marker="<!-- reqws-release-workflow:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT} -->"
          release_stage=''
          stage_started=$SECONDS
          finish_release_stage() {
            if [[ -n "$release_stage" ]]; then
              printf '[release][publish] stage=%s status=%s duration_s=%s\n' \
                "$release_stage" "$1" "$((SECONDS - stage_started))"
              release_stage=''
            fi
          }
          start_release_stage() {
            finish_release_stage success
            release_stage="$1"
            stage_started=$SECONDS
            printf '[release][publish] stage=%s status=started\n' "$release_stage"
          }
          cleanup_draft() {
            exit_code=$?
            trap - EXIT
            if [[ "$exit_code" -eq 0 ]]; then
              finish_release_stage success
            else
              finish_release_stage failed
              printf '[release][publish] status=failed exit_code=%s\n' "$exit_code"
            fi
            if [[ "$exit_code" -ne 0 && "$release_creation_attempted" == 'true' ]]; then
              release_is_draft="$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || true)"
              release_body="$(gh release view "$TAG" --json body --jq '.body' 2>/dev/null || true)"
              if [[ "$release_is_draft" == 'true' && "$release_body" == *"$release_owner_marker"* ]]; then
                printf '[release][publish] stage=cleanup-draft status=started\n'
                echo "Removing incomplete draft release for $TAG."
                if gh release delete "$TAG" --yes; then
                  printf '[release][publish] stage=cleanup-draft status=success\n'
                else
                  printf '[release][publish] stage=cleanup-draft status=failed\n'
                  echo "::warning::Could not remove incomplete draft release for $TAG."
                fi
              else
                printf '[release][publish] stage=cleanup-draft status=skipped\n'
                echo "::warning::Release cleanup skipped because $TAG could not be confirmed as this run's draft."
              fi
            fi
            exit "$exit_code"
          }
          trap cleanup_draft EXIT

          start_release_stage check-existing-release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A GitHub Release already exists for $TAG; refusing to replace it."
            exit 1
          fi

          notes="$release_owner_marker
          > [!WARNING]
          > The macOS app ZIP uses a persistent personal self-signed identity. It is not Developer ID signed or notarized. The first update-enabled version requires manual installation; Gatekeeper may require individual approval.

          The Desktop app is Apple silicon (arm64) only. The separate GoLand plugin ZIP is author-signed. Marketplace availability depends on JetBrains review. Marketplace mode: ${REQWS_MARKETPLACE_MODE}. Bootstrap requires manual initial upload; paused mode disables submission. The plugin is not bundled into the Desktop app."

          start_release_stage create-draft
          release_creation_attempted=true
          gh release create "$TAG" \
            --verify-tag \
            --draft \
            --fail-on-no-commits \
            --title "ReqWS $TAG" \
            --generate-notes \
            --notes "$notes"

          start_release_stage upload-assets
          gh release upload "$TAG" "${files[@]}"

          start_release_stage verify-draft-assets
          if [[ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" != 'true' ]]; then
            echo '::error::Release must remain a draft until its assets are verified.'
            exit 1
          fi

          expected_assets_file="${RUNNER_TEMP}/expected-release-assets"
          actual_assets_file="${RUNNER_TEMP}/actual-release-assets"
          printf '%s\n' \
            "ReqWS-${VERSION}-macos-arm64.zip" \
            "ReqWS-${VERSION}-goland-plugin.zip" \
            'latest-mac.yml' \
            'SHA256SUMS' \
            | LC_ALL=C sort > "$expected_assets_file"
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort > "$actual_assets_file"
          if ! diff -u "$expected_assets_file" "$actual_assets_file"; then
            echo '::error::Draft release assets are incomplete or unexpected.'
            exit 1
          fi

          if gh release view "$TAG" --json assets --jq '.assets[].size' | grep -Eq '^0$'; then
            echo '::error::Draft release contains an empty asset.'
            exit 1
          fi

          start_release_stage download-draft-assets
          downloaded="$(mktemp -d "${RUNNER_TEMP}/reqws-draft-verify.XXXXXX")"
          gh release download "$TAG" --dir "$downloaded"
          start_release_stage verify-downloaded-bytes
          cmp 'dist/release/SHA256SUMS' "$downloaded/SHA256SUMS"
          python3 scripts/verify-release-assets.py --directory "$downloaded" --version "$VERSION"

          start_release_stage publish-release
          gh release edit "$TAG" --draft=false
          release_creation_attempted=false


  publish-marketplace:
    name: Submit signed plugin to Marketplace
    needs: [validate, publish]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/marketplace-publish.yml
