name: Weekly GoLand API compatibility

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goland-weekly-api
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  targets:
    name: Freeze complete stable targets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: revision
        run: printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: targets
        run: python3 scripts/ide_compatibility.py resolve --mode full --output targets/targets.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-targets
          path: targets/targets.json
          if-no-files-found: error
          retention-days: 14

  main-candidate:
    needs: targets
    name: Build current default-branch candidate
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.targets.outputs.revision }}
          persist-credentials: false
      - uses: ./.github/actions/setup-goland
      - name: Retain baseline gates and build one candidate
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          ./integrations/goland/gradlew -p integrations/goland compileIntegrationTestKotlin test verifyBaselineTestReports verifyForbiddenProductionSymbols \
            verifyPluginProjectConfiguration verifyPluginStructure exportPluginArchivePath --no-daemon -PreleaseVersion="$version"
          python3 -u scripts/run_ide_verifier.py --baseline --archive "$(cat integrations/goland/build/release/plugin-archive.txt)" \
            --version "$version" --output integrations/goland/build/reports/api-baseline
          python3 scripts/stage_ide_candidate.py --input "$(cat integrations/goland/build/release/plugin-archive.txt)" --version "$version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-main-candidate
          path: candidate
          if-no-files-found: error
          retention-days: 14

      - name: Preserve baseline reports and original API failures
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-main-baseline
          path: |
            integrations/goland/build/test-results
            integrations/goland/build/reports
            !integrations/goland/build/reports/pluginVerifier/verifier-home/**
          if-no-files-found: error
          retention-days: 14

  released-candidate:
    needs: targets
    name: Fetch exact latest released plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.targets.outputs.revision }}
          persist-credentials: false
      - name: Read release metadata and checksum-verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/fetch_released_ide_candidate.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: weekly-released-candidate
          path: candidate
          if-no-files-found: error
          retention-days: 14

  main-api:
    needs: [targets, main-candidate]
    uses: ./.github/workflows/goland-verification.yml
    with:
      candidate-artifact: weekly-main-candidate
      targets-artifact: weekly-targets
      matrix: ${{ needs.targets.outputs.matrix }}
      evidence-artifact: weekly-main-evidence
      source-ref: ${{ needs.targets.outputs.revision }}

  released-api:
    # Serialize candidate matrices so this run never has four API workers at once.
    # A main API failure must still allow an independent released-candidate verdict.
    needs: [targets, released-candidate, main-api]
    if: ${{ !cancelled() && needs.targets.result == 'success' && needs.released-candidate.result == 'success' }}
    uses: ./.github/workflows/goland-verification.yml
    with:
      candidate-artifact: weekly-released-candidate
      targets-artifact: weekly-targets
      matrix: ${{ needs.targets.outputs.matrix }}
      historical: true
      evidence-artifact: weekly-released-evidence
      source-ref: ${{ needs.targets.outputs.revision }}
