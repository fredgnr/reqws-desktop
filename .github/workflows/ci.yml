name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks and macOS package smoke
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Electron downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/Library/Caches/electron
          key: electron-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}

      - name: Install locked dependencies
        run: npm ci

      - name: Run release packaging regression tests
        run: python3 -m unittest discover -s tests/workflows -p 'test_*.py' -v

      - name: Run project checks
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          export REQWS_OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          npm run check

      - name: Package and verify the arm64 app
        run: npm run package:macos -- --skip-ci --skip-check --arch arm64

  goland-plugin:
    name: GoLand plugin checks
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CI: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up GoLand build
        uses: ./.github/actions/setup-goland

      # Exercise the same version override and ZIP staging as a tag build, without publishing.
      - name: Read plugin candidate version
        id: version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Test, verify, and package the plugin
        working-directory: integrations/goland
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew test verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin buildPlugin --no-daemon -PreleaseVersion="$PLUGIN_VERSION"

      - name: Verify plugin release ZIP and version
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/prepare-goland-release.py --version "$PLUGIN_VERSION"
