name: CI

on:
  # A PR has one run, rather than separate branch-push and merge-ref runs.
  # Unsubmitted branches can still use workflow_dispatch.
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  impact:
    name: Classify change impact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      docsOnly: ${{ steps.impact.outputs.docsOnly }}
      desktop: ${{ steps.impact.outputs.desktop }}
      plugin: ${{ steps.impact.outputs.plugin }}
      localIntegrationRecommended: ${{ steps.impact.outputs.localIntegrationRecommended }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: impact
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ide_ci.py --base "$BASE" --output impact.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-impact
          path: impact.json
          retention-days: 14

  docs:
    name: Documentation checks
    needs: impact
    if: ${{ needs.impact.outputs.docsOnly == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm run docs:check

  project-checks:
    needs: impact
    if: ${{ needs.impact.outputs.docsOnly != 'true' }}
    name: Project and workflow checks
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: 'true'

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Desktop dependencies
        uses: ./.github/actions/setup-desktop
        with:
          npm-cache-write: 'true'

      - name: Install locked dependencies without the Electron runtime
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Set up Java for isolated plugin signature tests
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up OpenSSL for disposable identity tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: |
          if ! brew list --versions openssl@3 >/dev/null 2>&1; then
            brew install openssl@3
          fi
          printf 'REQWS_OPENSSL=%s/bin/openssl\n' "$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Run release packaging regression tests
        run: python3 -m unittest discover -s tests/workflows -p 'test_*.py' -v

      - name: Run project checks
        run: npm run check

  desktop-e2e:
    name: Desktop Electron regression
    needs: impact
    if: ${{ needs.impact.outputs.desktop == 'true' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: 'true'
      REQWS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Desktop dependencies
        uses: ./.github/actions/setup-desktop
        with:
          electron: 'true'
          electron-cache-write: 'true'
      - name: Install locked dependencies
        run: npm ci
      - name: Run one-worker Electron regression without retries
        run: python3 scripts/desktop_e2e.py --mode source
      - name: Verify deliberate preload failure and complete evidence
        run: python3 scripts/desktop_e2e.py --mode negative
      - name: Preserve Electron reports and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-desktop-e2e
          path: |
            test-results
            playwright-report
          if-no-files-found: error
          retention-days: 7

  macos-package:
    needs: impact
    if: ${{ needs.impact.outputs.docsOnly != 'true' }}
    name: macOS package smoke
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: 'true'
      REQWS_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Desktop dependencies
        uses: ./.github/actions/setup-desktop
        with:
          electron: 'true'
          electron-cache-write: 'true'

      - name: Install locked dependencies
        run: npm ci

      - name: Package and verify the arm64 app
        run: npm run package:macos -- --skip-ci --skip-check --arch arm64

      - name: Smoke the same verified app on the disposable hosted runner
        run: python3 scripts/desktop_e2e.py --mode packaged --app out/ReqWS-darwin-arm64/ReqWS.app

      - name: Preserve packaged startup reports and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-desktop-packaged
          path: test-results
          if-no-files-found: error
          retention-days: 7

  # Preserve the existing required check name. Neither a failed nor a cancelled
  # dependency may become a green aggregate; all original checks still run.
  checks:
    name: Checks and macOS package smoke
    if: ${{ always() }}
    needs: [impact, docs, project-checks, macos-package, desktop-e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report repository cache usage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate --slurp "repos/${GH_REPO}/actions/caches?per_page=100" > "$RUNNER_TEMP/reqws-caches.json"
          python3 - "$RUNNER_TEMP/reqws-caches.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          with open(sys.argv[1]) as stream:
              caches = [entry for page in json.load(stream) for entry in page['actions_caches']]
          print('\n### Repository cache snapshot\n')
          print(f"{len(caches)} entries; {sum(c['size_in_bytes'] for c in caches) / 1024**3:.2f} GiB total.\n")
          print('| Ref | Key | MiB |\n|---|---|---:|')
          for entry in sorted(caches, key=lambda c: c['size_in_bytes'], reverse=True)[:20]:
              ref = entry['ref'].replace('|', '\\|').replace('`', '')
              key = entry['key'].replace('|', '\\|').replace('`', '')
              print(f"| {ref} | {key} | {entry['size_in_bytes'] / 1024**2:.1f} |")
          PY

      - name: Require all applicable Desktop gates
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          DOCS_ONLY: ${{ needs.impact.outputs.docsOnly }}
          DESKTOP_REQUIRED: ${{ needs.impact.outputs.desktop }}
          DOCS_RESULT: ${{ needs.docs.result }}
          CHECK_RESULT: ${{ needs.project-checks.result }}
          PACKAGE_RESULT: ${{ needs.macos-package.result }}
          E2E_RESULT: ${{ needs.desktop-e2e.result }}
        run: |
          python3 - <<'PYTHON'
          import os, sys
          sys.path.insert(0, 'scripts')
          from ide_ci import aggregate_desktop
          def boolean(name):
              value = os.environ.get(name)
              if value not in ('true', 'false'):
                  raise ValueError(f'Missing or invalid impact output: {name}')
              return value == 'true'
          print(aggregate_desktop({'docsOnly': boolean('DOCS_ONLY'), 'desktop': boolean('DESKTOP_REQUIRED')},
            {key: os.environ.get(name) for key, name in [('impact', 'IMPACT_RESULT'), ('docs', 'DOCS_RESULT'),
              ('checks', 'CHECK_RESULT'), ('package', 'PACKAGE_RESULT'), ('e2e', 'E2E_RESULT')]}))
          PYTHON

  plugin-targets:
    name: Freeze official GoLand targets
    needs: impact
    if: ${{ needs.impact.outputs.plugin == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: targets
        # Until first 262 acceptance is recorded, scan the full stable set on every PR.
        run: python3 scripts/ide_compatibility.py resolve --mode full --output targets/targets.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-ide-targets
          path: targets/targets.json
          if-no-files-found: error
          retention-days: 14

  plugin-build:
    name: Baseline GoLand tests and candidate
    needs: impact
    if: ${{ needs.impact.outputs.plugin == 'true' }}
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-goland
        with:
          cache-write: 'true'
      - name: Read plugin candidate version
        id: version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Retain baseline tests and structural gates; build once
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./integrations/goland/gradlew -p integrations/goland compileIntegrationTestKotlin test verifyBaselineTestReports verifyForbiddenProductionSymbols \
            verifyPluginProjectConfiguration verifyPluginStructure exportPluginArchivePath --no-daemon -PreleaseVersion="$PLUGIN_VERSION"
          python3 -u scripts/run_ide_verifier.py --baseline --archive "$(cat integrations/goland/build/release/plugin-archive.txt)" \
            --version "$PLUGIN_VERSION" --output integrations/goland/build/reports/api-baseline
          python3 scripts/prepare-goland-release.py --input "$(cat integrations/goland/build/release/plugin-archive.txt)" --version "$PLUGIN_VERSION"
          python3 scripts/stage_ide_candidate.py --input "dist/release/ReqWS-${PLUGIN_VERSION}-goland-plugin.zip" --version "$PLUGIN_VERSION"
      - name: Verify versioned download cache paths
        run: python3 scripts/ci-cache-config.py goland-downloads
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-ide-candidate
          path: candidate
          if-no-files-found: error
          retention-days: 14
      - name: Preserve baseline reports
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-ide-baseline
          path: |
            integrations/goland/build/test-results
            integrations/goland/build/reports
            !integrations/goland/build/reports/pluginVerifier/verifier-home/**
          if-no-files-found: error
          retention-days: 14

  plugin-verification:
    needs: [impact, plugin-targets, plugin-build]
    if: ${{ needs.impact.outputs.plugin == 'true' }}
    uses: ./.github/workflows/goland-verification.yml
    with:
      candidate-artifact: ci-ide-candidate
      targets-artifact: ci-ide-targets
      matrix: ${{ needs.plugin-targets.outputs.matrix }}
      evidence-artifact: ci-ide-evidence

  goland-plugin:
    name: GoLand plugin checks
    if: ${{ always() }}
    needs: [impact, plugin-targets, plugin-build, plugin-verification]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all applicable automatic CI GoLand gates
        env:
          IMPACT_RESULT: ${{ needs.impact.result }}
          PLUGIN_REQUIRED: ${{ needs.impact.outputs.plugin }}
          TARGETS_RESULT: ${{ needs.plugin-targets.result }}
          BUILD_RESULT: ${{ needs.plugin-build.result }}
          VERIFICATION_RESULT: ${{ needs.plugin-verification.result }}
        run: |
          python3 - <<'PYTHON'
          import os, sys
          sys.path.insert(0, 'scripts')
          from ide_ci import aggregate
          print(aggregate({'plugin': os.environ['PLUGIN_REQUIRED'] == 'true', 'reason': 'Impact classifier found no plugin changes'},
            {key: os.environ[name] for key, name in [('impact', 'IMPACT_RESULT'), ('targets', 'TARGETS_RESULT'),
              ('build', 'BUILD_RESULT'), ('verification', 'VERIFICATION_RESULT')]}))
          PYTHON
          echo "Local IDE integration: not run by CI; see the separate candidate-bound local report." >> "$GITHUB_STEP_SUMMARY"
