name: Set up Desktop dependencies
description: Set up Node and restore npm tarballs; restore Electron only for packaging jobs.
inputs:
  npm-cache-write:
    description: Request npm cache writes from the default-branch check job.
    default: 'false'
  electron:
    description: Whether this job needs the Electron runtime download cache.
    default: 'false'
  electron-cache-write:
    description: Request Electron cache writes from the default-branch packaging job.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    - name: Read locked download versions
      id: versions
      shell: bash
      run: python3 scripts/ci-cache-config.py desktop

    - name: Restore npm downloads
      uses: ./.github/actions/cache-dependency
      with:
        path: ~/.npm/_cacache
        key: npm-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.npm-suffix }}
        restore-keys: npm-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.npm-prefix }}
        write: ${{ inputs.npm-cache-write }}

    - name: Restore Electron downloads
      if: inputs.electron == 'true'
      uses: ./.github/actions/cache-dependency
      with:
        path: ~/Library/Caches/electron
        key: electron-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.electron-version }}
        write: ${{ inputs.electron-cache-write }}
