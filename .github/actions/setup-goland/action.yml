name: Set up GoLand build
description: Restore small Gradle state and separately versioned IDE installer downloads.
inputs:
  cache-write:
    description: Request shared cache writes from the default-branch CI plugin job.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        distribution: temurin
        java-version: '25'

    - name: Resolve Gradle cache ownership
      id: policy
      shell: bash
      env:
        REQUEST_CACHE_WRITE: ${{ inputs.cache-write }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: python3 scripts/ci-cache-config.py policy

    - name: Read the GoLand download version
      id: versions
      shell: bash
      run: python3 scripts/ci-cache-config.py goland

    # setup-gradle already validates Wrapper JARs. Keep its deduplicated
    # dependency/DSL/transform/wrapper and small task caches. Do not discard
    # inexpensive incremental state just to save a few megabytes.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      with:
        cache-read-only: ${{ steps.policy.outputs.write != 'true' }}
        cache-cleanup: on-success
        gradle-home-cache-excludes: |
          caches/modules-2/files-2.1/go/goland
          caches/modules-2/files-2.1/com.jetbrains.intellij.goland/goland

    # Registration order matters: the installer cache saves first in reverse
    # post order, before setup-gradle deletes excluded paths and saves its state.
    # Do not also persist .intellijPlatform/ides (the extracted copy).
    - name: Restore GoLand installer downloads
      uses: ./.github/actions/cache-dependency
      with:
        path: |
          ~/.gradle/caches/modules-2/files-2.1/go/goland/${{ steps.versions.outputs.goland-version }}
          ~/.gradle/caches/modules-2/files-2.1/com.jetbrains.intellij.goland/goland/${{ steps.versions.outputs.goland-version }}
        key: goland-downloads-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.versions.outputs.goland-product }}-${{ steps.versions.outputs.goland-version }}
        write: ${{ inputs.cache-write }}
