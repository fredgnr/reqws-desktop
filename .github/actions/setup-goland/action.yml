name: Set up GoLand build
description: Install the pinned Java toolchain and restore Gradle and extracted IDE caches.

runs:
  using: composite
  steps:
    - name: Set up Java
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        distribution: temurin
        java-version: '25'

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    # Keep SDKs separate from task outputs, sandboxes and configuration-cache state.
    # An exact toolchain key is reusable across source commits and CI/Release jobs.
    - name: Cache extracted GoLand IDEs
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: integrations/goland/.intellijPlatform/ides
        key: goland-ides-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('integrations/goland/*.gradle.kts', 'integrations/goland/gradle.properties', 'integrations/goland/gradle/**') }}
